name: Release Linux bundles (amd64 & arm64)

# Per-arch Linux bundles for the release:
#
#   linux-src (always runs)
#     Source tree + bundled PHP launcher, shipped as
#     mirzabot-linux-{amd64,arm64}-src.tar.gz. Works on any glibc distro;
#     the target box needs a working PHP CLI (the launcher detects it).
#
#   linux-bin (opt-in, commented out)
#     Full bundle with a *bundled static PHP binary* for arm64 — requires a
#     self-hosted ARM runner. To enable: de-comment the job, provide a runner
#     labelled "self-hosted-arm", and confirm the spc/php source URLs.
#
#     Building a portable static `php` for *amd64* is not wired up in this
#     file yet: the static-php toolchain only publishes the `spc` builder
#     itself (not prebuilt PHP binaries), so an amd64 bin build would need a
#     verified source URL first. Until then, amd64 gets the source bundle.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build the Linux bundles for
        required: true

permissions:
  contents: write

jobs:
  linux-src:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Compose source bundle
        id: bundle
        run: |
          set -e
          TAGV="${{ steps.tag.outputs.name }}"
          TAGV="${TAGV#v}"
          OUT="mirzabot-linux-${ARCH}-src"
          STAGE="/tmp/${OUT}"
          mkdir -p "$STAGE"
          # Bot source (without dev-only bits)
          rsync -a --exclude '.git' --exclude '.github' ./ "$STAGE/"
          # Launcher: runs table.php with whatever php is available on the box
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            '# Boots the bot schema (table.php) with a PHP CLI on this machine.' \
            'set -e' \
            'cd "$(dirname "$0")"' \
            'PHP_BIN="$(command -v php || echo ./php)"' \
            '"$PHP_BIN" -d "memory_limit=512M" -d "max_execution_time=300" table.php' \
            > "$STAGE/run-bot.sh"
          chmod +x "$STAGE/run-bot.sh"
          tar -czf "${OUT}-${TAGV}.tar.gz" -C /tmp "${OUT}"
          echo "file=${OUT}-${TAGV}.tar.gz" >> "$GITHUB_OUTPUT"
          ls -lh "${OUT}-${TAGV}.tar.gz"

      - name: Attach source bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          FILE: ${{ steps.bundle.outputs.file }}
        run: |
          set -e
          # Create the release only if it does not exist yet. (A tag push can
          # race with a sibling workflow that creates it first.)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "$FILE" --clobber

  # ── OPT-IN: full bundle with a bundled static PHP binary (arm64) ──────
